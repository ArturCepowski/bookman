version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookman_postgres
    environment:
      POSTGRES_DB: bookman
      POSTGRES_USER: bookman
      POSTGRES_PASSWORD: bookman_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookman -d bookman"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

volumes:
  postgres_data:
