spring:
  application:
    name: bookman-backend
  config:
    # Optional local file with KEY=VALUE lines (see .env.example); real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    # Defaults match docker-compose.yml (local development only). Production sets these via env.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookman}
    username: ${DATABASE_USER:bookman}
    password: ${DATABASE_PASSWORD:bookman_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  messages:
    # SMS texts (REQ-11/12/14): sms.properties (English) and sms_pl.properties.
    basename: sms
    encoding: UTF-8
    fallback-to-system-locale: false

bookman:
  jwt:
    # No default on purpose: startup fails unless BOOKMAN_JWT_SECRET (>= 32 bytes) is set.
    secret: ${BOOKMAN_JWT_SECRET:}
    # REQ-01 / Q-15 (confirmed): a login session lasts 30 days.
    ttl: ${BOOKMAN_JWT_TTL:30d}
  import:
    # REQ-06: every apartment is re-imported every 30 minutes.
    interval: ${BOOKMAN_IMPORT_INTERVAL:PT30M}
    initial-delay: PT1M
    scheduler-enabled: true
  sms:
    # REQ-13: "log" (development, default) or "smsapi" (production, see Q-05).
    provider: ${BOOKMAN_SMS_PROVIDER:log}
    scheduler-enabled: true
    planner-interval: PT1M
    dispatcher-interval: PT10S
    smsapi:
      url: ${BOOKMAN_SMSAPI_URL:https://api.smsapi.pl/sms.do}
      token: ${BOOKMAN_SMSAPI_TOKEN:}
      sender: ${BOOKMAN_SMSAPI_SENDER:}
