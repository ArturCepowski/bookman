spring:
  application:
    name: bookman-backend
  config:
    # Optional local file with KEY=VALUE lines (see .env.example); real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    # Defaults match docker-compose.yml (local development only). Production sets these via env.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookman}
    username: ${DATABASE_USER:bookman}
    password: ${DATABASE_PASSWORD:bookman_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

bookman:
  jwt:
    # No default on purpose: startup fails unless BOOKMAN_JWT_SECRET (>= 32 bytes) is set.
    secret: ${BOOKMAN_JWT_SECRET:}
    # ASSUMPTION(REQ-01): a login session lasts 30 days; spec does not define expiry, see Q-15.
    ttl: ${BOOKMAN_JWT_TTL:30d}
